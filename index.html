<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Elden Ring Night Reign - True Random Slot</title>
    <style>
        body {
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            color: #d4c3a1;
            font-family: 'serif';
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .logo {
            width: 90%;
            max-width: 730px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(197, 160, 89, 0.3));
        }

        .container {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .slot-box {
            width: 220px; 
            height: 380px;
            background-color: #000;
            position: relative;
            border: 5px solid #c5a059;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 額縁の色の帯 */
        .color-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-width: 12px;
            border-style: solid;
            pointer-events: none;
            z-index: 10;
        }
        .red-slot { border-color: #ff0000; box-shadow: 0 0 50px rgba(255, 0, 0, 0.5); }
        .blue-slot { border-color: #0044ff; box-shadow: 0 0 50px rgba(0, 68, 255, 0.5); }
        .green-slot { border-color: #00ff00; box-shadow: 0 0 50px rgba(0, 255, 0, 0.5); }

        .slot-box::after {
            content: "";
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid #c5a059;
            z-index: 11;
            pointer-events: none;
        }

        .reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
            z-index: 1;
        }

        .reel img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        button {
            background-color: #111;
            color: #c5a059;
            border: 1px solid #c5a059;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:disabled { opacity: 0.2; cursor: not-allowed; }

        .stop-btn { padding: 10px 40px; font-size: 1.1rem; letter-spacing: 2px; }
        .start-btn { padding: 18px 100px; font-size: 1.5rem; letter-spacing: 8px; margin-top: 20px; }

        .btn-container { position: relative; }
        .pulse {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid #c5a059; opacity: 0; pointer-events: none;
        }
        .animate-pulse { animation: pulse-animation 0.6s ease-out; }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5, 2); opacity: 0; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="logo">

    <div class="container">
        <div class="slot-wrapper">
            <div class="slot-box">
                <div class="color-border red-slot"></div>
                <div id="reel-red" class="reel"></div>
            </div>
            <button class="stop-btn" id="stop-red" disabled>STOP</button>
        </div>
        <div class="slot-wrapper">
            <div class="slot-box">
                <div class="color-border blue-slot"></div>
                <div id="reel-blue" class="reel"></div>
            </div>
            <button class="stop-btn" id="stop-blue" disabled>STOP</button>
        </div>
        <div class="slot-wrapper">
            <div class="slot-box">
                <div class="color-border green-slot"></div>
                <div id="reel-green" class="reel"></div>
            </div>
            <button class="stop-btn" id="stop-green" disabled>STOP</button>
        </div>
    </div>

    <div class="btn-container">
        <div id="pulse-effect" class="pulse"></div>
        <button id="action-btn" class="start-btn">抽選開始</button>
    </div>

    <script>
        const images = ["01.png", "02.png", "03.png", "04.png", "05.png", "06.png", "07.png", "08.png", "09.png", "10.png"];
        const ITEM_HEIGHT = 220;
        const VIEW_HEIGHT = 380;
        const OFFSET = (VIEW_HEIGHT - ITEM_HEIGHT) / 2;

        const reels = [
            { id: 'red', element: document.getElementById('reel-red'), stopBtn: document.getElementById('stop-red'), y: 0, speed: 0, isSpinning: false, totalItems: 0 },
            { id: 'blue', element: document.getElementById('reel-blue'), stopBtn: document.getElementById('stop-blue'), y: 0, speed: 0, isSpinning: false, totalItems: 0 },
            { id: 'green', element: document.getElementById('reel-green'), stopBtn: document.getElementById('stop-green'), y: 0, speed: 0, isSpinning: false, totalItems: 0 }
        ];

        const startBtn = document.getElementById('action-btn');
        const pulse = document.getElementById('pulse-effect');

        // 配列をランダムに混ぜる関数
        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // リールの初期化（各色ごとに個別のランダム配列を作成）
        reels.forEach(reel => {
            let combinedImages = [];
            // 5回分、ランダムに混ぜた10枚セットを追加する（合計50枚の長いリール）
            for (let i = 0; i < 5; i++) {
                combinedImages = combinedImages.concat(shuffle(images));
            }
            
            reel.totalItems = combinedImages.length;
            
            combinedImages.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                reel.element.appendChild(img);
            });
            
            // 最初に見える位置を調整
            reel.y = -ITEM_HEIGHT + OFFSET;
            reel.element.style.transform = `translateY(${reel.y}px)`;
        });

        function triggerPulse() {
            pulse.classList.remove('animate-pulse');
            void pulse.offsetWidth; 
            pulse.classList.add('animate-pulse');
        }

        function update() {
            reels.forEach(reel => {
                if (reel.isSpinning || reel.speed > 0) {
                    reel.y -= reel.speed;
                    // ループ処理：リールの末端に来たら先頭付近に戻す
                    const limit = -(reel.totalItems * ITEM_HEIGHT) + VIEW_HEIGHT;
                    if (reel.y <= limit) {
                        reel.y += (reel.totalItems - 5) * ITEM_HEIGHT; // 自然にループするように調整
                    }
                    reel.element.style.transform = `translateY(${reel.y}px)`;
                }
            });
            requestAnimationFrame(update);
        }
        update();

        startBtn.addEventListener('click', () => {
            triggerPulse();
            startBtn.disabled = true;
            reels.forEach(reel => {
                // 速度もリールごとにわずかに変えるとさらに不規則に見えます
                reel.speed = 25 + Math.random() * 10; 
                reel.isSpinning = true;
                reel.stopBtn.disabled = false;
            });
        });

        reels.forEach(reel => {
            reel.stopBtn.addEventListener('click', () => {
                reel.stopBtn.disabled = true;
                reel.isSpinning = false;

                const timer = setInterval(() => {
                    reel.speed *= 0.92; // 減速
                    
                    if (reel.speed < 2) {
                        clearInterval(timer);
                        reel.speed = 0;
                        
                        // 現在位置から最も近い画像の中央に吸着
                        const currentPos = Math.abs(reel.y);
                        const nearestIndex = Math.round((currentPos + OFFSET) / ITEM_HEIGHT);
                        const targetY = -(nearestIndex * ITEM_HEIGHT) + OFFSET;
                        
                        reel.element.style.transition = "transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)";
                        reel.y = targetY;
                        reel.element.style.transform = `translateY(${reel.y}px)`;
                        
                        setTimeout(() => {
                            reel.element.style.transition = "";
                            checkAllStopped();
                        }, 600);
                    }
                }, 50);
            });
        });

        function checkAllStopped() {
            if (reels.every(r => r.speed === 0 && !r.isSpinning)) {
                startBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
